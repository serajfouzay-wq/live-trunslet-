<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Translation Screen</title>
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/display.css">
</head>
<body>
  <div class="bg"><div class="bg-img"></div><div class="bg-tint"></div></div>
  <main class="stage">
    <header class="hdr"></header>
    <section class="lanes"></section>
    <div class="orig"><b></b><span></span></div>
  </main>
  <aside class="qr" data-pos="bottom-right"><img alt="QR code"><strong>Scan to read in your language</strong><small></small></aside>
  <div class="live-badge"><i></i>LIVE</div>
  <div class="dot" title="Reconnecting"></div>
  <div class="hint">Press F for full screen</div>
  <script type="module" src="/assets/js/display.js"></script>
</body>
</html>
