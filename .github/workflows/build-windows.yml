name: Build Windows app

on:
  push:
    branches: [claude/clever-cannon-ritjuc, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      SMOKE_DIR: ${{ runner.temp }}\lt-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test
        continue-on-error: true

      - name: Offline engines work on Windows (download packs, translate, transcribe)
        env:
          DATA_DIR: ${{ env.SMOKE_DIR }}
        run: node scripts/smoke-offline.mjs

      - name: Build installer (Setup.exe) and portable exe
        run: npm run dist

      - name: Packaged app starts and translates offline
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist\win-unpacked -Filter "*.exe" | Where-Object { $_.Name -like "Live Translate*" } | Select-Object -First 1
          # the speech engine's native module loads inside Electron's runtime
          $env:ELECTRON_RUN_AS_NODE = "1"
          & $exe.FullName -e "const s=require('./dist/win-unpacked/resources/app/node_modules/sherpa-onnx-node'); console.log('sherpa-onnx', s.version)"
          if ($LASTEXITCODE -ne 0) { throw "speech engine did not load in Electron" }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          $env:LT_DATA_DIR = $env:SMOKE_DIR
          $p = Start-Process -FilePath $exe.FullName -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { $st = Invoke-RestMethod -Uri http://localhost:3000/api/state -TimeoutSec 3; $ok = $true; break } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "the packaged app did not start" }
          $r = Invoke-RestMethod -Method Post -Uri http://localhost:3000/api/offline/try -ContentType 'application/json' -Body '{"text":"Good evening everyone, welcome to our conference."}'
          $r | ConvertTo-Json -Depth 5
          if (-not $r.results.ar.text) { Stop-Process -Id $p.Id -Force; throw "offline translation failed in the packaged app" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-Windows
          path: dist/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Live Translate (build ${{ github.run_number }})
          prerelease: true
          body: |
            **LiveTranslate-Setup-*.exe** installs the app (Start menu + desktop shortcut).
            **LiveTranslate-Portable-*.exe** runs without installing.
            This build was checked on Windows: offline translation and offline speech recognition work, and the packaged app starts.
          files: dist/*.exe
